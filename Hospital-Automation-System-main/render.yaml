services:
  - type: web
    name: hospital-automation-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-automation-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        value: admin@hospital.com
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: WHATSAPP_MOCK
        value: "true"

databases:
  - name: hospital-automation-db
    databaseName: hospital_automation
    user: hospital_automation
    region: singapore
    plan: free
